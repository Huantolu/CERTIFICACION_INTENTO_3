<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Misión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sesion.css') }}">
</head>
<body>
        <form action="/crear_mision" method="post" class="caja">
            <h1>Registro</h1>
            <label for="Nombre_mision">Nombre:</label>
            <input type="text" id="Nombre_mision" name="nombre">
            <br><br>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha">
            <br><br>
            <label for="voluntarios_necesarios">Voluntarios Necesarios:</label>
            <input type="int" id="voluntarios_necesarios" name="voluntarios_necesarios">
            <br><br>
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion">
            <br><br>
            <input type="submit" value="Crear">
            {% with mensajes = get_flashed_messages(category_filter=['registro']) %}
                {% for mensaje in mensajes %}
                    <p class="error">{{ mensaje }}</p>
                {% endfor %}
            {% endwith %}
            <input type="hidden" name="usuario_id" value="{{ usuario_sesion.id }}">
        </form>
    </div>
</body>
</html>
