<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Misión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mision_formulario.css') }}">
</head>
<body>
    <div class="menu">
        <img src="../static/img/people-fill.svg" alt="">
        <h1 class="title">VoluntaMe</h1>
        <div class="botones_menu">
            <a href="/formulario_mision">
                <button>Crear Misión</button>
            </a>
            <!-------------------------------------->
            <a href="/cerrar_sesion">
                <button>Cerrar Sesión</button>
            </a>
        </div>
    </div>
        <form action="/editar_mision" method="post" class="caja">
            <h1>Editar Misión</h1>
            <input type="hidden" name="id" value="{{mision.id}}">
            <label for="Nombre_mision">Nombre:</label>
            <input type="text" id="Nombre_mision" name="nombre" value="{{ mision.nombre }}">
            <br><br>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" value="{{ mision.fecha }}">
            <br><br>
            <label for="voluntarios_necesarios">Voluntarios Necesarios:</label>
            <input type="int" id="voluntarios_necesarios" name="voluntarios_necesarios" value="{{ mision.voluntarios_necesarios }}">
            <br><br>
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion" value="{{ mision.descripcion }}">
            <br><br>
            <input class="submit" type="submit" value="Actualizar">
            {% with mensajes = get_flashed_messages(category_filter=['registro']) %}
                {% for mensaje in mensajes %}
                    <p class="error">{{ mensaje }}</p>
                {% endfor %}
            {% endwith %}
            <input type="hidden" name="usuario_id" value="{{ usuario_sesion.id }}">
        </form>
    </div>
</body>
</html>
